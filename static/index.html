<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sathi AI — Your Digital Friend</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --bg-2: #f7f7f8; --bg-3: #ececf1;
    --border: #e5e5e7; --text: #1a1a1a; --text-dim: #6b6b75;
    --accent: #d92d3f; --accent-2: #e63946;
    --user-bubble: #f1f1f3; --assistant-bubble: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,0.04);
  }
  body.dark {
    --bg: #0f0f14; --bg-2: #16161f; --bg-3: #1e1e2a;
    --border: #2a2a3a; --text: #e8e8f0; --text-dim: #8a8aa0;
    --user-bubble: #2a4a7f; --assistant-bubble: #1e1e2a;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }
  /* Sidebar, brand, new-chat button, history — same as before */
  .sidebar { width: 260px; background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 12px; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .brand-logo { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: white; }
  .brand-info h1 { font-size: 15px; font-weight: 700; }
  .brand-info p { font-size: 11px; color: var(--text-dim); }
  .new-chat { display: flex; align-items: center; gap: 10px; background: var(--accent); color: white; border: none; padding: 11px 14px; border-radius: 10px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
  .new-chat:hover { background: #b82434; }
  .sidebar-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); padding: 0 10px 8px; font-weight: 600; }
  .history { flex: 1; overflow-y: auto; }
  .history-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 13px; color: var(--text-dim); cursor: pointer; margin-bottom: 2px; }
  .history-item:hover, .history-item.active { background: var(--bg-3); color: var(--text); }
  .sidebar-footer { border-top: 1px solid var(--border); padding-top: 12px; font-size: 11px; color: var(--text-dim); text-align: center; }
  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); }
  .topbar-title { font-size: 14px; font-weight: 600; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .icon-btn:hover { background: var(--bg-2); color: var(--text); }
  #messages { flex: 1; overflow-y: auto; padding: 32px 24px; }
  .inner { max-width: 780px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
  .msg { display: flex; gap: 12px; animation: fadeIn 0.3s; align-items: flex-start; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .avatar { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; }
  .avatar.user { background: linear-gradient(135deg, #3b6fd4, #2a4a9f); font-size: 11px; }
  .avatar.bot { background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-size: 16px; }
  .bubble-wrap { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .bubble { padding: 12px 16px; border-radius: 14px; line-height: 1.65; font-size: 14.5px; word-wrap: break-word; }
  .msg.user .bubble { background: var(--user-bubble); border-top-left-radius: 4px; }
  .msg.bot .bubble { background: var(--assistant-bubble); border-top-left-radius: 4px; border: 1px solid var(--border); }
  .bubble pre { background: var(--bg-2); padding: 14px; border-radius: 10px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); font-size: 13px; }
  .bubble code { font-family: 'Courier New', monospace; font-size: 13px; background: var(--bg-2); padding: 2px 6px; border-radius: 4px; }
  .copy-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-top: 8px; align-self: flex-start; }
  .typing span { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite; margin-right: 4px; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
  .welcome { text-align: center; padding: 40px 20px; margin: auto; }
  .welcome-logo { width: 64px; height: 64px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 30px; color: white; margin: 0 auto 20px; }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; margin: 0 auto; }
  .suggestion { background: var(--bg); border: 1px solid var(--border); padding: 14px 16px; border-radius: 12px; text-align: left; cursor: pointer; color: var(--text); font-family: inherit; }
  .suggestion:hover { border-color: var(--accent); }
  .input-area { padding: 16px 24px 20px; border-top: 1px solid var(--border); }
  .input-wrap { max-width: 780px; margin: 0 auto; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 8px 8px 8px 16px; display: flex; align-items: flex-end; gap: 8px; }
  .input-wrap:focus-within { border-color: var(--accent); }
  textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 14.5px; resize: none; max-height: 200px; padding: 10px 0; }
  .send-btn { background: var(--accent); border: none; color: white; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .send-btn:disabled { opacity: 0.4; }
  .hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 10px; }
  @media (max-width: 768px) { .sidebar { position: absolute; z-index: 100; height: 100%; margin-left: -260px; } .sidebar.open { margin-left: 0; } .suggestions { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-logo">S</div>
    <div class="brand-info">
      <h1>Sathi AI</h1>
      <p>तपाईंको डिजिटल साथी</p>
    </div>
  </div>
  <button class="new-chat" id="newChat">+ New Chat</button>
  <div class="sidebar-label">Recent</div>
  <div class="history" id="history"></div>
  <div class="sidebar-footer">
    <div>Made with ❤️ in Nepal</div>
    <div>Powered by Gemini</div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbarTitle">New conversation</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="darkToggle" title="Toggle theme">🌙</button>
      <button class="icon-btn" id="uploadBtn" title="Upload file">📎</button>
      <button class="icon-btn" id="voiceBtn" title="Voice input">🎤</button>
    </div>
  </div>
  <div id="messages"><div class="inner" id="inner"></div></div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" placeholder="Message Sathi AI..." rows="1"></textarea>
      <button class="send-btn" id="send">➤</button>
    </div>
    <div class="hint">Sathi can make mistakes. Verify important information.</div>
  </div>
</main>

<input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.txt,.docx">

<script>
const BACKEND_URL = "";
const inner = document.getElementById("inner");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const newChatBtn = document.getElementById("newChat");
const historyEl = document.getElementById("history");
const topbarTitle = document.getElementById("topbarTitle");
const sidebar = document.getElementById("sidebar");
const darkToggle = document.getElementById("darkToggle");
const voiceBtn = document.getElementById("voiceBtn");
const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");

let sessionId = null;
let isSending = false;

// ---------- Dark Mode ----------
const savedTheme = localStorage.getItem("theme") || "light";
if (savedTheme === "dark") {
  document.body.classList.add("dark");
  darkToggle.textContent = "☀️";
}
darkToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark");
  const isDark = document.body.classList.contains("dark");
  localStorage.setItem("theme", isDark ? "dark" : "light");
  darkToggle.textContent = isDark ? "☀️" : "🌙";
});

// ---------- Voice Input (Web Speech API) ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "en-US";

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    input.value = transcript;
    voiceBtn.style.background = "";
    sendMessage();
  };
  recognition.onerror = () => { voiceBtn.style.background = ""; };
  recognition.onend = () => { voiceBtn.style.background = ""; };
}
voiceBtn.addEventListener("click", () => {
  if (!recognition) { alert("Voice input not supported in this browser."); return; }
  voiceBtn.style.background = "#d92d3f";
  recognition.start();
});

// ---------- File Upload ----------
uploadBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  try {
    const res = await fetch(`${BACKEND_URL}/upload`, { method: "POST", body: formData });
    const data = await res.json();
    input.value = `[Uploaded: ${data.filename}] Please analyze this file.`;
    sendMessage();
  } catch (err) {
    alert("Upload failed: " + err.message);
  }
});

// ---------- Conversations (from server) ----------
async function loadConversations() {
  try {
    const res = await fetch(`${BACKEND_URL}/conversations`);
    const convs = await res.json();
    historyEl.innerHTML = "";
    convs.forEach(c => addHistoryItem(c));
  } catch (e) { console.error(e); }
}

function addHistoryItem(conv) {
  const item = document.createElement("div");
  item.className = "history-item";
  item.dataset.id = conv.id;
  item.innerHTML = `<span>${(conv.title || "New Chat").slice(0, 30)}</span>`;
  item.addEventListener("click", () => loadConversation(conv.id));
  historyEl.prepend(item);
}

async function loadConversation(convId) {
  sessionId = convId;
  document.querySelectorAll(".history-item").forEach(h => h.classList.remove("active"));
  const item = document.querySelector(`.history-item[data-id="${convId}"]`);
  if (item) item.classList.add("active");
  const res = await fetch(`${BACKEND_URL}/conversations/${convId}`);
  const data = await res.json();
  inner.innerHTML = "";
  data.messages.forEach(m => {
    if (m.role === "user") addMessage("user", m.content);
    else addMessage("assistant", m.content);
  });
}

// ---------- Messages ----------
function showWelcome() {
  inner.innerHTML = `
    <div class="welcome">
      <div class="welcome-logo">S</div>
      <h2>Namaste! I'm Sathi.</h2>
      <p>Your friendly AI assistant. How can I help you today?</p>
      <div class="suggestions">
        <button class="suggestion" data-text="What is the GDP of Nepal?">💰 Nepal GDP</button>
        <button class="suggestion" data-text="Write a Python function to sort a list">💻 Write code</button>
        <button class="suggestion" data-text="Tell me a fun fact about the Himalayas">🏔️ Himalayas</button>
        <button class="suggestion" data-text="Translate 'Good morning' to Nepali">🇳🇵 Translate</button>
      </div>
    </div>`;
  document.querySelectorAll(".suggestion").forEach(btn => {
    btn.addEventListener("click", () => { input.value = btn.dataset.text; sendMessage(); });
  });
}

function addMessage(role, content = "", opts = {}) {
  if (document.querySelector(".welcome")) inner.innerHTML = "";
  const msg = document.createElement("div");
  msg.className = `msg ${role === "user" ? "user" : "bot"}`;
  const avatar = document.createElement("div");
  avatar.className = `avatar ${role === "user" ? "user" : "bot"}`;
  avatar.textContent = role === "user" ? "You" : "S";
  const wrap = document.createElement("div");
  wrap.className = "bubble-wrap";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (opts.typing) bubble.innerHTML = `<span class="typing"><span></span><span></span><span></span></span>`;
  else if (role === "bot") bubble.innerHTML = marked.parse(content || "");
  else bubble.textContent = content;
  wrap.appendChild(bubble);
  msg.appendChild(avatar);
  msg.appendChild(wrap);
  inner.appendChild(msg);
  document.getElementById("messages").scrollTop = 999999;
  return { bubble, wrap };
}

// ---------- Send ----------
async function sendMessage() {
  const text = input.value.trim();
  if (!text || isSending) return;
  isSending = true;
  input.value = ""; input.style.height = "auto";
  sendBtn.disabled = true;
  addMessage("user", text);
  const { bubble, wrap } = addMessage("assistant", "", { typing: true });
  let fullText = "", firstChunk = true;

  try {
    const res = await fetch(`${BACKEND_URL}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    sessionId = res.headers.get("X-Session-Id") || sessionId;

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (firstChunk) { bubble.innerHTML = ""; firstChunk = false; }
      fullText += decoder.decode(value, { stream: true });
      bubble.innerHTML = marked.parse(fullText);
      document.getElementById("messages").scrollTop = 999999;
    }

    if (fullText.trim()) {
      const copyBtn = document.createElement("button");
      copyBtn.className = "copy-btn"; copyBtn.textContent = "Copy";
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(fullText);
        copyBtn.textContent = "Copied!"; setTimeout(() => copyBtn.textContent = "Copy", 1500);
      };
      wrap.appendChild(copyBtn);
    }
    // Refresh conversation list
    loadConversations();
  } catch (err) {
    bubble.innerHTML = `<span style="color:#d92d3f;">Error: ${err.message}</span>`;
  } finally {
    isSending = false; sendBtn.disabled = false; input.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});

// ---------- New Chat (keeps history) ----------
newChatBtn.addEventListener("click", () => {
  sessionId = null;
  inner.innerHTML = "";
  topbarTitle.textContent = "New conversation";
  document.querySelectorAll(".history-item").forEach(h => h.classList.remove("active"));
  showWelcome();
  input.focus();
});

// ---------- Init ----------
showWelcome();
loadConversations();
input.focus();
</script>
</body>
</html>
