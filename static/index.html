<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sathi AI — Your Digital Friend</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-2: #f7f7f8;
    --bg-3: #ececf1;
    --border: #e5e5e7;
    --text: #1a1a1a;
    --text-dim: #6b6b75;
    --accent: #d92d3f;
    --accent-2: #e63946;
    --user-bubble: #f1f1f3;
    --assistant-bubble: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .sidebar {
    width: 260px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    flex-shrink: 0;
    transition: margin-left 0.3s ease;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .brand-logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: white;
    box-shadow: 0 4px 10px rgba(217,45,63,0.25);
  }
  .brand-info h1 { font-size: 15px; font-weight: 700; color: var(--text); }
  .brand-info p { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .new-chat {
    display: flex; align-items: center; gap: 10px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 14px;
    border-radius: 10px;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    cursor: pointer;
    margin-bottom: 20px;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    box-shadow: 0 2px 6px rgba(217,45,63,0.25);
  }
  .new-chat:hover { background: #b82434; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(217,45,63,0.35); }
  .new-chat svg { width: 16px; height: 16px; }
  .sidebar-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); padding: 0 10px 8px; font-weight: 600;
  }
  .history { flex: 1; overflow-y: auto; }
  .history-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .history-item:hover { background: var(--bg-3); color: var(--text); }
  .history-item.active { background: #ffffff; color: var(--text); box-shadow: var(--shadow); }
  .history-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: #ffffff;
    z-index: 2;
  }
  .topbar-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px rgba(34,197,94,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .menu-btn { display: none; background: transparent; border: none; color: var(--text); cursor: pointer; padding: 6px; }
  #messages { flex: 1; overflow-y: auto; padding: 32px 24px; }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 4px; }
  #messages::-webkit-scrollbar-thumb:hover { background: #b1b1b6; }
  .inner { max-width: 780px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
  .msg { display: flex; gap: 12px; animation: fadeIn 0.3s ease; align-items: flex-start; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .avatar {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: white;
  }
  .avatar.user { background: linear-gradient(135deg, #3b6fd4, #2a4a9f); font-size: 11px; }
  .avatar.bot { background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-size: 16px; }
  .bubble-wrap { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .bubble {
    padding: 12px 16px; border-radius: 14px; line-height: 1.65; font-size: 14.5px;
    max-width: 100%; word-wrap: break-word; overflow-wrap: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); border-top-left-radius: 4px; color: var(--text); }
  .msg.bot .bubble {
    background: var(--assistant-bubble); border-top-left-radius: 4px;
    border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .bubble p { margin-bottom: 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { color: #000; font-weight: 600; }
  .bubble ul, .bubble ol { margin: 10px 0 10px 20px; }
  .bubble li { margin-bottom: 4px; }
  .bubble code {
    font-family: 'Courier New', monospace; font-size: 13px;
    background: #f4f4f6; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--border); color: #d92d3f;
  }
  .bubble pre {
    background: #f8f8fa; padding: 14px; border-radius: 10px;
    overflow-x: auto; margin: 10px 0; border: 1px solid var(--border);
    font-size: 13px; line-height: 1.5;
  }
  .bubble pre code { background: transparent; border: none; padding: 0; color: var(--text); }
  .bubble a { color: var(--accent); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .copy-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
    margin-top: 8px; font-family: inherit; transition: all 0.15s; align-self: flex-start;
  }
  .copy-btn:hover { background: var(--bg-2); color: var(--text); border-color: #d1d1d6; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; animation: bounce 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
  .welcome { text-align: center; padding: 40px 20px; margin: auto; }
  .welcome-logo {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 30px; color: white;
    margin: 0 auto 20px; box-shadow: 0 8px 24px rgba(217,45,63,0.3);
  }
  .welcome h2 { font-size: 24px; margin-bottom: 8px; font-weight: 700; color: var(--text); }
  .welcome p { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; margin: 0 auto; }
  .suggestion {
    background: #ffffff; border: 1px solid var(--border); padding: 14px 16px;
    border-radius: 12px; text-align: left; cursor: pointer; color: var(--text);
    font-family: inherit; font-size: 13px; line-height: 1.4; transition: all 0.15s; box-shadow: var(--shadow);
  }
  .suggestion:hover { background: var(--bg-2); border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .suggestion strong { display: block; margin-bottom: 3px; font-size: 13.5px; color: var(--text); }
  .suggestion span { color: var(--text-dim); font-size: 12px; }
  .input-area { padding: 16px 24px 20px; background: #ffffff; z-index: 2; }
  .input-wrap {
    max-width: 780px; margin: 0 auto; background: #ffffff;
    border: 1px solid var(--border); border-radius: 16px;
    padding: 8px 8px 8px 16px; display: flex; align-items: flex-end; gap: 8px;
    transition: border-color 0.15s, box-shadow 0.15s; box-shadow: var(--shadow);
  }
  .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217,45,63,0.12); }
  textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 14.5px;
    line-height: 1.5; resize: none; max-height: 200px; padding: 10px 0;
  }
  textarea::placeholder { color: var(--text-dim); }
  .send-btn {
    background: var(--accent); border: none; color: white;
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s, background 0.15s;
    box-shadow: 0 2px 6px rgba(217,45,63,0.25);
  }
  .send-btn:hover:not(:disabled) { background: #b82434; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(217,45,63,0.35); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; }
  .hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 10px; }
  @media (max-width: 768px) {
    .sidebar { position: absolute; z-index: 100; height: 100%; margin-left: -260px; box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
    .sidebar.open { margin-left: 0; }
    .menu-btn { display: flex; }
    .suggestions { grid-template-columns: 1fr; }
    .bubble { font-size: 14px; }
    #messages { padding: 20px 16px; }
    .input-area { padding: 12px 16px 16px; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-logo">S</div>
    <div class="brand-info">
      <h1>Sathi AI</h1>
      <p>तपाईंको डिजिटल साथी</p>
    </div>
  </div>
  <button class="new-chat" id="newChat">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
    </svg>
    New Chat
  </button>
  <div class="sidebar-label">Recent</div>
  <div class="history" id="history"></div>
  <div class="sidebar-footer">
    <div>Made with ❤️ in Nepal</div>
    <div style="margin-top:4px; opacity:0.7;">Powered by Gemini</div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <div class="topbar-title" id="topbarTitle">New conversation</div>
    <div class="status">
      <span class="dot"></span>
      <span>Online</span>
    </div>
  </div>
  <div id="messages">
    <div class="inner" id="inner"></div>
  </div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" placeholder="Message Sathi AI..." rows="1"></textarea>
      <button class="send-btn" id="send" title="Send">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
    <div class="hint">Sathi can make mistakes. Verify important information.</div>
  </div>
</main>

<script>
const BACKEND_URL = "";

const inner = document.getElementById("inner");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const newChatBtn = document.getElementById("newChat");
const historyEl = document.getElementById("history");
const topbarTitle = document.getElementById("topbarTitle");
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");

let sessionId = null;
let isSending = false;

const suggestions = [
  { title: "Explain a concept", sub: "Quantum computing in simple terms" },
  { title: "Write code", sub: "Python function to sort a list" },
  { title: "Translate", sub: "English to Nepali phrases" },
  { title: "Brainstorm", sub: "Ideas for a weekend trip in Nepal" }
];

function showWelcome() {
  inner.innerHTML = `
    <div class="welcome">
      <div class="welcome-logo">S</div>
      <h2>Namaste! I'm Sathi.</h2>
      <p>Your friendly AI assistant. How can I help you today?</p>
      <div class="suggestions">
        ${suggestions.map(s => `
          <button class="suggestion" data-text="${s.sub}">
            <strong>${s.title}</strong>
            <span>${s.sub}</span>
          </button>
        `).join("")}
      </div>
    </div>
  `;
  document.querySelectorAll(".suggestion").forEach(btn => {
    btn.addEventListener("click", () => {
      input.value = btn.dataset.text;
      sendMessage();
    });
  });
}

function addMessage(role, content = "", opts = {}) {
  if (document.querySelector(".welcome")) inner.innerHTML = "";
  const msg = document.createElement("div");
  msg.className = `msg ${role === "user" ? "user" : "bot"}`;
  const avatar = document.createElement("div");
  avatar.className = `avatar ${role === "user" ? "user" : "bot"}`;
  avatar.textContent = role === "user" ? "You" : "S";
  const wrap = document.createElement("div");
  wrap.className = "bubble-wrap";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (opts.typing) {
    bubble.innerHTML = `<span class="typing"><span></span><span></span><span></span></span>`;
  } else if (role === "assistant" || role === "bot") {
    bubble.innerHTML = marked.parse(content || "");
  } else {
    bubble.textContent = content;
  }
  wrap.appendChild(bubble);
  msg.appendChild(avatar);
  msg.appendChild(wrap);
  inner.appendChild(msg);
  scrollToBottom();
  return { msg, bubble, wrap };
}

function scrollToBottom() {
  const m = document.getElementById("messages");
  m.scrollTop = m.scrollHeight;
}

function addToHistory(text) {
  const item = document.createElement("div");
  item.className = "history-item";
  item.innerHTML = `
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;">
      <path stroke-linecap="round" d="M8 10h8M8 14h5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <span>${text.slice(0, 28)}${text.length > 28 ? "…" : ""}</span>
  `;
  document.querySelectorAll(".history-item").forEach(h => h.classList.remove("active"));
  item.classList.add("active");
  historyEl.prepend(item);
  topbarTitle.textContent = text.slice(0, 40) + (text.length > 40 ? "…" : "");
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isSending) return;
  isSending = true;
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;

  addMessage("user", text);
  if (historyEl.children.length === 0) addToHistory(text);

  const { bubble, wrap } = addMessage("assistant", "", { typing: true });
  let fullText = "";
  let firstChunk = true;

  try {
    const res = await fetch(`${BACKEND_URL}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    sessionId = res.headers.get("X-Session-Id") || sessionId;

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (firstChunk) { bubble.innerHTML = ""; firstChunk = false; }
      fullText += decoder.decode(value, { stream: true });
      bubble.innerHTML = marked.parse(fullText);
      scrollToBottom();
    }

    if (fullText.trim()) {
      const copyBtn = document.createElement("button");
      copyBtn.className = "copy-btn";
      copyBtn.textContent = "Copy";
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(fullText);
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = "Copy", 1500);
      };
      wrap.appendChild(copyBtn);
    }
  } catch (err) {
    bubble.innerHTML = `<span style="color:#d92d3f;">Error: ${err.message}</span>`;
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});

// ✅ FIXED: Start a new chat WITHOUT clearing the history sidebar
newChatBtn.addEventListener("click", () => {
  sessionId = null;
  inner.innerHTML = "";
  topbarTitle.textContent = "New conversation";
  // Remove "active" highlight from history items (but keep them!)
  document.querySelectorAll(".history-item").forEach(h => h.classList.remove("active"));
  showWelcome();
  input.focus();
});

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("open");
});

showWelcome();
input.focus();
</script>
</body>
</html>
